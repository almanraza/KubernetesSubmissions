apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      nodeName: k3d-k3s-default-server-0

      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: shared-data-claim

      containers:
        - name: log-writer
          image: log-output:1.11
          imagePullPolicy: Never
          command: ["python", "writer.py"]
          volumeMounts:
            - name: shared-data
              mountPath: /shared

        - name: log-reader
          image: log-output:1.11
          imagePullPolicy: Never
          command: ["python", "server.py"]
          env:
            - name: PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: shared-data
              mountPath: /shared